[project]
name = "incidentiq-backend"
version = "0.1.0"
description = "Backend API for IncidentIQ incident response"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]
