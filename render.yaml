services:
  - type: web
    name: incidentiq-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://incident-response-agent-puce.vercel.app,http://localhost:5173
      - key: HINDSIGHT_API_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BANK_ID
        sync: false
      - key: LOVABLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
